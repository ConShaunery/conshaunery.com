<!DOCTYPE html>
<html>
<head>
  <title>conshaunery.com</title>
  <style>
    body {
      background-color: #493370;
      color: white;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 16px;
      margin: 0;
      padding: 0;
    }

    h1, h2, h3, h6 {
      color: white;
      font-weight: bold;
      text-align: center;
    }

    p {
      line-height: 1.5;
      text-align: center;
    }

    a {
      color: orange;
      text-decoration: none;
      margin: 0 10px;
    }

    a:hover {
      color: white;
    }

    .info-box {
      max-width: 900px;
      margin: 40px auto;
      padding: 24px 32px;
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid rgb(64, 255, 58);
      border-radius: 14px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
      text-align: center;
    }

    /* SECRET BUTTON */
    #secret-button {
      position: fixed;
      top: 15px;
      left: 15px;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.75);
      border: 2px solid rgb(64, 255, 58);
      color: rgb(64, 255, 58);
      font-size: 13px;
      cursor: pointer;
      display: none;
      border-radius: 8px;
      z-index: 9999;
    }

    #secret-button:hover {
      background: rgb(64, 255, 58);
      color: black;
    }
  </style>
</head>

<body>

  <!-- SECRET BUTTON -->
  <a id="secret-button" href="secret.html">
    <img src="./gifs/time.gif" alt="secret gif">
  </a>

  <!-- MUSIC -->
  <audio autoplay loop>
    <source src="./sounds/music/monkeyball.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <!-- IMAGE -->
  <div style="text-align: center; margin-top: 40px;">
    <img src="./gifs/abootme.gif" alt="About me animation">
  </div>

  <!-- INFO BOX -->
  <div class="info-box">
    <h1>its the man. the myth. the legends. Yur boy Conshaunery</h1>
    <h3>links</h3>
    <a href="https://www.bitview.net/user/ConShaunery" target="_blank">BitView</a>
    <a href="https://spacehey.com/profile?id=1863486" target="_blank">SpaceHey</a>
  </div>

  <!-- TIME LOGIC -->
  <script>
    (function () {
      const now = new Date();

      // Monday only
      const allowedDay = 1; // 0=Sunday, 1=Monday
      const startHour = 0;  // 12 AM
      const endHour = 1;    // 1 AM

      if (
        now.getDay() === allowedDay &&
        now.getHours() >= startHour &&
        now.getHours() < endHour
      ) {
        document.getElementById("secret-button").style.display = "block";
      }
    })();
  </script>

</body>
</html>
