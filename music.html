      .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
      }
      h1, h2, h3, h6 {
        color: white;
        font-weight: bold;

        color: #ffffff;

        text-align: left;
      }

      .retro-player {
  background-color: #fff;
  border: 3px solid #000;
  border-radius: 5px;
  padding: 10px;
  margin: 10px;
  font-family: 'Courier New', Courier, monospace;
  font-size: 16px;
  color: #000;
  text-align: center;
  width: 300px;
  height: 60px;
  line-height: 60px;
}

.retro-player::-webkit-media-controls {
  display: none !important;
}

.retro-player::-webkit-media-controls-enclosure {
  height: 0;
}

.retro-player::-webkit-media-controls-overlay-play-button {
  background-color: #000;
  border: none;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  color: #fff;
  font-size: 20px;
  line-height: 30px;
  text-align: center;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

/* ===== WINAMP PLAYER ===== */
.winamp {
  width: 340px;
  background: #2b2b2b;
  border: 2px solid #000;
  box-shadow: inset 0 0 0 2px #555;
  font-family: "Courier New", monospace;
  color: #00ff9c;
  padding: 8px;
  margin: 20px auto;
}

/* DISPLAY */
.winamp-display {
  background: #000;
  border: 1px solid #444;
  padding: 6px;
  font-size: 13px;
  overflow: hidden;
  white-space: nowrap;
}

.marquee {
  display: inline-block;
  padding-left: 100%;
  animation: marquee 10s linear infinite;
}

@keyframes marquee {
  0% { transform: translateX(0); }
  100% { transform: translateX(-100%); }
}

/* CONTROLS */
.winamp-controls {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
}

.winamp button {
  background: #3a3a3a;
  border: 1px solid #111;
  color: #00ff9c;
  font-size: 12px;
  padding: 4px 8px;
  cursor: pointer;
}

.winamp button:hover {
  background: #00ff9c;
  color: #000;
}

/* VOLUME */
.winamp input[type="range"] {
  flex: 1;
}

/* SPECTRUM */
.spectrum {
  display: flex;
  gap: 2px;
  height: 20px;
  margin-top: 6px;
}

.bar {
  width: 6px;
  background: #00ff9c;
  animation: bounce 1s infinite ease-in-out;
}

.bar:nth-child(odd) { animation-delay: .2s; }
.bar:nth-child(even) { animation-delay: .4s; }

@keyframes bounce {
  0% { height: 5px; }
  50% { height: 20px; }
  100% { height: 5px; }
}

/* PLAYLIST */
.playlist {
  margin-top: 8px;
  border-top: 1px solid #444;
  padding-top: 6px;
}

.playlist div {
  cursor: pointer;
  padding: 2px 0;
}

.playlist div:hover {
  b

}


    </style>
  </head>
  <body>
    <div class="container">
      <img src ="./gifs/Tunez!.gif">
      <br>
      <br>
      <br>


/* WINAMP */
<div class="winamp">
  <div class="winamp-display">
    <span class="marquee" id="track-title">
      alexi murdoch – all of my days
    </span>
  </div>

  <div class="spectrum">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    <div class="bar"></div><div class="bar"></div>
  </div>

  <div class="winamp-controls">
    <button onclick="play()">▶</button>
    <button onclick="pause()">■</button>
    <input type="range" min="0" max="1" step="0.01" value="0.7" onchange="setVolume(this)">
  </div>

  <audio id="player">
    <source src="./sounds/music/Alexi Murdoch - All My Days.mp3" type="audio/mpeg">
  </audio>

/* PLAYLIST */
  <div class="playlist">
    <div onclick="loadTrack(this, './sounds/music/Alexi Murdoch - All My Days.mp3')">
      Alexi Murdoch – All My Days
    </div>
    <div onclick="loadTrack(this, './sounds/music/drums_and_riffs_ext_hox.mp3')">
      half-life - drums_and_riffs
    </div>
    <div onclick="loadTrack(this, './sounds/music/i_stay_away.mp3')">
      alice in chains – i stay away
    </div>

    <div onclick="loadTrack(this, './sounds/music/opus_one.mp3')">
      tim carleton - opus one
    </div>

    <div onclick="loadTrack(this, './sounds/music/Collective Soul - Shine.mp3')"">
      collective soul - shine
    </div>


     <div onclick="loadTrack(this, './sounds/music/nutshell.mp3')">
      alice in chains – nutshell
    </div>

    <div onclick="loadTrack(this, './sounds/music/Into Dust.mp3')">
      mazzystar - into dust
    </div>

  </div>
</div>
/* WINAMP */


    </div>

<script>
  const audio = document.getElementById("player");
  const title = document.getElementById("track-title");

  function play() {
    audio.play();
  }

  function pause() {
    audio.pause();
  }

  function setVolume(slider) {
    audio.volume = slider.value;
  }

  function loadTrack(el, src) {
    audio.pause();
    audio.src = src;
    title.textContent = el.textContent;
    audio.play();
  }
</script>



  </body>
  <footer>
