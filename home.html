<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
<title>home — conshaunery.com</title>
<style type="text/css">

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width:100%; height:100%; background:#000008; overflow:hidden; color:#fff; font-family:"Tahoma","Arial",sans-serif; }

/* ── LAYOUT ── */
#mode-desktop { width:100%; height:100%; display:flex; flex-direction:column; }

.desktop {
  flex:1; position:relative; overflow:hidden; cursor:default;
  background: #000010 center/cover no-repeat;
}
.desktop::before {
  content:''; position:absolute; inset:0; pointer-events:none; z-index:1;
  background: repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);
}
.desktop::after {
  content:'conshaunery.com'; position:absolute; bottom:14px; right:18px;
  font-size:10px; color:rgba(255,255,255,0.12); font-family:"Courier New",monospace;
  letter-spacing:2px; pointer-events:none; z-index:2;
}

/* ── Desktop Icons ── */
.icon { position:absolute; width:80px; text-align:center; cursor:pointer; padding:3px; z-index:3; }
.icon-inner { padding:3px 4px 5px; border:1px dotted transparent; display:flex; flex-direction:column; align-items:center; gap:5px; }
.icon img { width:40px; height:40px; object-fit:contain; image-rendering:pixelated; display:block; }
.icon span {
  display:block; font-size:10px; color:#fff;
  text-shadow:1px 1px 2px #000,-1px -1px 2px #000,1px -1px 2px #000,-1px 1px 2px #000;
  line-height:1.3; word-break:break-word;
}
.icon.selected .icon-inner { background:rgba(0,60,160,0.55); border:1px dotted #aabbff; }
.icon:hover .icon-inner { background:rgba(30,80,200,0.3); }

/* ── Taskbar ── */
.taskbar {
  height:30px; background:linear-gradient(180deg,#3a1060,#1a0035);
  border-top:2px solid #7722cc; display:flex; align-items:center;
  padding:0 4px; gap:4px; flex-shrink:0;
  box-shadow:0 -2px 12px rgba(100,0,200,0.4); position:relative; z-index:500;
}
.start-btn {
  height:22px; flex-shrink:0;
  background:linear-gradient(180deg,#7700ee,#4400aa);
  border-top:1px solid #bb66ff; border-left:1px solid #bb66ff;
  border-right:1px solid #330077; border-bottom:1px solid #330077;
  color:#fff; font-size:11px; font-weight:bold; padding:0 10px 0 6px;
  cursor:pointer; font-family:"Comic Sans MS",Arial;
  display:flex; align-items:center; gap:5px; user-select:none;
}
.start-btn:active, .start-btn.active {
  border-top:1px solid #330077; border-left:1px solid #330077;
  border-right:1px solid #bb66ff; border-bottom:1px solid #bb66ff;
  background:linear-gradient(180deg,#4400aa,#7700ee);
}
.start-btn img { width:16px; height:16px; object-fit:contain; image-rendering:pixelated; }

.taskbar-divider { width:1px; height:20px; flex-shrink:0; background:linear-gradient(180deg,transparent,#6633cc,transparent); }
.taskbar-wins { flex:1; display:flex; align-items:center; gap:3px; overflow:hidden; }

.tb-win-btn {
  height:22px; max-width:140px;
  background:rgba(60,20,120,0.7);
  border-top:1px solid #8844cc; border-left:1px solid #8844cc;
  border-right:1px solid #220055; border-bottom:1px solid #220055;
  color:#ccaaff; font-size:10px; padding:0 8px; cursor:pointer;
  font-family:"Tahoma",Arial; display:flex; align-items:center; gap:5px;
  overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
}
.tb-win-btn:hover { background:rgba(90,30,160,0.8); }
.tb-win-btn.minimized-btn { opacity:0.55; }
.tb-win-btn img { width:14px; height:14px; object-fit:contain; image-rendering:pixelated; flex-shrink:0; }

.taskbar-tray {
  display:flex; align-items:center; gap:7px; padding:0 8px; height:22px; flex-shrink:0;
  background:rgba(0,0,0,0.3);
  border-top:1px solid #330077; border-left:1px solid #330077;
  border-right:1px solid #8844cc; border-bottom:1px solid #8844cc;
}
.tray-dot { width:8px; height:8px; border-radius:50%; background:#6600cc; animation:tray-pulse 3s ease-in-out infinite; }
@keyframes tray-pulse { 0%,100%{background:#6600cc;box-shadow:0 0 3px #9933ff} 50%{background:#9933ff;box-shadow:0 0 8px #cc66ff} }

.vol-wrap { display:flex; align-items:center; gap:5px; border-right:1px solid #440088; padding-right:8px; }
.vol-icon { font-size:13px; color:#9977cc; cursor:pointer; user-select:none; }
.vol-icon:hover { color:#ccaaff; }
.vol-slider { -webkit-appearance:none; appearance:none; width:68px; height:4px; outline:none; cursor:pointer; border:none; border-radius:2px; }
.vol-slider::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:#cc88ff; border:1px solid rgba(255,255,255,0.3); box-shadow:0 0 5px #9933ff; cursor:pointer; }
.vol-slider::-moz-range-thumb { width:12px; height:12px; border-radius:50%; background:#cc88ff; border:1px solid rgba(255,255,255,0.3); cursor:pointer; }
.clock-label { font-size:11px; color:#ccccff; font-family:"Courier New",monospace; min-width:70px; text-align:center; }

/* ── Start Menu ── */
#start-menu {
  position:fixed; bottom:30px; left:0; width:210px; z-index:9000;
  display:none; flex-direction:row;
  border-top:2px solid #cc88ff; border-right:2px solid #cc88ff; border-left:2px solid #220055;
  box-shadow:4px 0 18px rgba(100,0,200,0.55);
}
#start-menu.open { display:flex; }
.sm-strip {
  width:26px; flex-shrink:0; background:linear-gradient(180deg,#6600cc,#220055);
  display:flex; align-items:center; justify-content:center;
}
.sm-strip span {
  writing-mode:vertical-rl; transform:rotate(180deg);
  font-size:11px; font-weight:bold; color:rgba(255,255,255,0.45);
  letter-spacing:3px; font-family:"Comic Sans MS",Arial; user-select:none;
}
.sm-items { flex:1; background:#0e0022; padding:4px 0; }
.sm-item {
  display:flex; align-items:center; gap:8px; padding:6px 10px;
  cursor:pointer; font-size:11px; color:#ddccff; font-family:"Tahoma",Arial; user-select:none;
}
.sm-item:hover { background:linear-gradient(90deg,#4400aa,#7722cc); color:#fff; }
.sm-item img { width:16px; height:16px; object-fit:contain; image-rendering:pixelated; flex-shrink:0; }
.sm-sep { height:1px; background:linear-gradient(90deg,transparent,#6633cc 20%,#6633cc 80%,transparent); margin:3px 6px; }

/* ── Win98 Windows ── */
#win-container { position:fixed; inset:0; pointer-events:none; z-index:600; }
.win98 {
  position:absolute; display:flex; flex-direction:column;
  border-top:2px solid #cc88ff; border-left:2px solid #cc88ff;
  border-right:2px solid #220055; border-bottom:2px solid #220055;
  box-shadow:3px 3px 0 #000,0 0 24px rgba(100,0,200,0.5); pointer-events:all;
}
.win98.minimized { display:none; }
.win-titlebar {
  height:28px; flex-shrink:0;
  background:linear-gradient(90deg,#2200aa 0%,#9933cc 50%,#2200aa 100%);
  display:flex; align-items:center; padding:0 7px; cursor:move; user-select:none;
}
.win-titlebar.inactive { background:linear-gradient(90deg,#111133 0%,#443366 50%,#111133 100%); }
.win-btns { display:flex; gap:6px; flex-shrink:0; margin-right:9px; }
.win-btn {
  width:16px; height:16px; border-radius:50%; border:none; cursor:pointer; padding:0; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:9px; color:transparent; transition:color 0.1s;
}
.win-btn:hover { color:rgba(0,0,0,0.65); }
.win-btn-close { background:radial-gradient(circle at 35% 35%,#ff7070,#cc0000); box-shadow:0 0 5px rgba(200,0,0,0.6); }
.win-btn-min   { background:radial-gradient(circle at 35% 35%,#bb88ff,#7700cc); box-shadow:0 0 5px rgba(110,0,200,0.6); }
.win-btn-max   { background:radial-gradient(circle at 35% 35%,#ffee66,#ccaa00); box-shadow:0 0 5px rgba(180,140,0,0.6); }
.win-btn-close:hover { background:radial-gradient(circle at 35% 35%,#ff9999,#ff2222); }
.win-btn-min:hover   { background:radial-gradient(circle at 35% 35%,#ddaaff,#9922ee); }
.win-btn-max:hover   { background:radial-gradient(circle at 35% 35%,#ffff99,#eecc00); }
.win-icon  { width:16px; height:16px; object-fit:contain; image-rendering:pixelated; flex-shrink:0; }
.win-title { flex:1; font-size:11px; color:#fff; font-weight:bold; font-family:"Tahoma",Arial; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-left:5px; }
.win-body { flex:1; overflow:hidden; background:#000010; border-top:1px solid #000; display:flex; flex-direction:column; }
.win-body iframe { flex:1; width:100%; border:none; display:block; min-height:0; }
.win-body-scroll { flex:1; overflow-y:auto; background:#0a001a; }
.win-resize { position:absolute; bottom:0; right:0; width:14px; height:14px; cursor:se-resize; background:linear-gradient(135deg,transparent 40%,#6633cc 40%,#6633cc 55%,transparent 55%,transparent 70%,#6633cc 70%); }

/* ── Browser chrome ── */
.browser-toolbar {
  height:28px; flex-shrink:0; background:linear-gradient(180deg,#1e0040,#0e001e);
  border-bottom:1px solid #330055; display:flex; align-items:center; gap:3px; padding:0 5px;
}
.br-btn {
  height:20px; min-width:26px; flex-shrink:0;
  background:linear-gradient(180deg,#5500aa,#330077);
  border-top:1px solid #9955ff; border-left:1px solid #9955ff;
  border-right:1px solid #220044; border-bottom:1px solid #220044;
  color:#ccaaff; font-size:12px; cursor:pointer; padding:0 5px;
  display:flex; align-items:center; justify-content:center; font-family:"Tahoma",Arial;
  user-select:none;
}
.br-btn:disabled { opacity:0.35; cursor:default; }
.br-btn:not(:disabled):hover { background:linear-gradient(180deg,#7700cc,#440099); color:#fff; }
.br-btn:not(:disabled):active { border-top:1px solid #220044; border-left:1px solid #220044; border-right:1px solid #9955ff; border-bottom:1px solid #9955ff; }
.br-addr {
  flex:1; height:20px; background:#000018; border:1px solid #440088;
  color:#ccaaff; font-size:11px; padding:0 7px; font-family:"Courier New",monospace; outline:none;
}
.br-addr:focus { border-color:#9933ff; box-shadow:0 0 6px rgba(153,51,255,0.4); }
.br-go {
  height:20px; padding:0 9px; flex-shrink:0;
  background:linear-gradient(180deg,#7700ee,#4400aa);
  border-top:1px solid #bb66ff; border-left:1px solid #bb66ff;
  border-right:1px solid #330077; border-bottom:1px solid #330077;
  color:#fff; font-size:10px; font-weight:bold; cursor:pointer; font-family:"Tahoma",Arial;
}
.br-go:hover { background:linear-gradient(180deg,#9922ff,#6600cc); }

.browser-navbar {
  height:24px; flex-shrink:0; background:#080015;
  border-bottom:1px solid #2a0050; display:flex; align-items:center; padding:0 5px; gap:1px; overflow:hidden;
}
.br-link {
  height:18px; padding:0 8px; background:transparent; border:none;
  color:#8866aa; font-size:10px; cursor:pointer; font-family:"Tahoma",Arial;
  white-space:nowrap; border-right:1px solid #1a0030; user-select:none;
}
.br-link:hover { color:#ddccff; background:rgba(100,0,200,0.2); }
.br-link.current { color:#ffff99; background:rgba(80,0,150,0.3); }
.br-status {
  height:18px; flex-shrink:0; background:linear-gradient(180deg,#0e001e,#06000f);
  border-top:1px solid #220044; font-size:9px; color:#664488;
  font-family:"Courier New",monospace; padding:0 8px; display:flex; align-items:center;
}

/* ── Notepad ── */
.notepad-body {
  flex:1; display:flex; flex-direction:column; background:#0a0018; min-height:0;
}
.notepad-toolbar {
  height:26px; flex-shrink:0; background:linear-gradient(180deg,#1a0035,#0e001e);
  border-bottom:1px solid #330055; display:flex; align-items:center; gap:4px; padding:0 6px;
}
.np-btn {
  height:18px; padding:0 8px; font-size:10px; cursor:pointer; font-family:"Tahoma",Arial;
  background:linear-gradient(180deg,#5500aa,#330077);
  border-top:1px solid #9955ff; border-left:1px solid #9955ff;
  border-right:1px solid #220044; border-bottom:1px solid #220044;
  color:#ccaaff;
}
.np-btn:hover { background:linear-gradient(180deg,#7700cc,#440099); color:#fff; }
.np-btn:active { border-top:1px solid #220044; border-left:1px solid #220044; border-right:1px solid #9955ff; border-bottom:1px solid #9955ff; }
.np-saved { font-size:9px; color:rgba(100,255,180,0.5); font-family:"Courier New",monospace; margin-left:6px; }
.notepad-area {
  flex:1; resize:none; border:none; outline:none; padding:12px;
  background:#0a0018; color:#e0d0ff; font-family:"Courier New",monospace; font-size:13px;
  line-height:1.6; caret-color:#cc88ff;
}
.notepad-area::selection { background:rgba(150,50,255,0.35); }
.notepad-statusbar {
  height:18px; flex-shrink:0; background:#06000f; border-top:1px solid #220044;
  font-size:9px; color:#553366; font-family:"Courier New",monospace;
  display:flex; align-items:center; padding:0 8px; gap:16px;
}

/* ── Wallpaper picker ── */
.wp-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:12px; }
.wp-thumb {
  aspect-ratio:16/9; background-size:cover; background-position:center;
  cursor:pointer; border:2px solid transparent; border-radius:3px; transition:border-color 0.12s,transform 0.1s;
}
.wp-thumb:hover  { border-color:#9933ff; transform:scale(1.04); }
.wp-thumb.active { border-color:#ffcc00; box-shadow:0 0 8px #ffcc00; }

/* ── File Explorer ── */
.fexp-toolbar { height:26px;flex-shrink:0;background:linear-gradient(180deg,#1a0035,#0e001e);border-bottom:1px solid #330055;display:flex;align-items:center;gap:3px;padding:0 5px; }
.fexp-up { height:18px;padding:0 8px;font-size:11px;cursor:pointer;background:linear-gradient(180deg,#5500aa,#330077);border-top:1px solid #9955ff;border-left:1px solid #9955ff;border-right:1px solid #220044;border-bottom:1px solid #220044;color:#ccaaff;flex-shrink:0; }
.fexp-up:hover { background:linear-gradient(180deg,#7700cc,#440099);color:#fff; }
.fexp-addr { flex:1;height:18px;background:#000018;border:1px solid #440088;color:#ccaaff;font-size:10px;padding:0 6px;font-family:"Courier New",monospace; }
.fexp-wrap { display:flex;flex:1;overflow:hidden;min-height:0; }
.fexp-tree { width:150px;flex-shrink:0;border-right:1px solid #220044;overflow-y:auto;background:#060012;padding:2px 0; }
.fexp-tree::-webkit-scrollbar,.fexp-content::-webkit-scrollbar { width:8px; }
.fexp-tree::-webkit-scrollbar-thumb,.fexp-content::-webkit-scrollbar-thumb { background:#330055; }
.fexp-content { flex:1;overflow-y:auto;background:#080018;padding:4px;display:flex;flex-wrap:wrap;align-content:flex-start; }
.fexp-tnode { display:flex;align-items:center;gap:4px;padding:3px 5px;cursor:pointer;font-size:10px;color:#aa88cc;white-space:nowrap;user-select:none; }
.fexp-tnode:hover { background:rgba(100,0,200,0.2);color:#ddbbff; }
.fexp-tnode.fsel { background:rgba(0,50,160,0.55);color:#fff; }
.fexp-tnode img { width:14px;height:14px;image-rendering:pixelated;flex-shrink:0; }
.fexp-file { width:72px;display:inline-flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;cursor:pointer;text-align:center;vertical-align:top;margin:2px;border:1px solid transparent; }
.fexp-file:hover { border-color:rgba(100,0,200,0.4);background:rgba(30,80,200,0.2); }
.fexp-file.fsel { background:rgba(0,50,160,0.55);border:1px dotted #aabbff; }
.fexp-file img { width:32px;height:32px;image-rendering:pixelated; }
.fexp-file span { font-size:9px;color:#fff;word-break:break-all;line-height:1.3;text-shadow:1px 1px 0 #000,-1px -1px 0 #000; }
.fexp-status { height:18px;flex-shrink:0;background:#06000f;border-top:1px solid #220044;font-size:9px;color:#553366;font-family:"Courier New",monospace;display:flex;align-items:center;padding:0 8px; }

/* ── Boot overlay ── */
#boot-overlay {
  position:fixed; inset:0; z-index:100002;
  background:#000; display:flex; flex-direction:column;
  font-family:"Courier New",monospace;
  overflow:hidden; transition:opacity 0.8s;
}
#boot-overlay.fade-out { opacity:0; pointer-events:none; }
#boot-header {
  padding:18px 24px 10px;
  border-bottom:1px solid #003300;
  color:#00aa00; font-size:11px; letter-spacing:1px;
}
#boot-header .bh-title { font-size:14px; color:#00ff41; font-weight:bold; margin-bottom:4px; }
#boot-log {
  flex:1; padding:12px 24px; overflow:hidden;
  font-size:11px; line-height:1.7; color:#00cc33;
}
#boot-log .ok  { color:#00ff41; }
#boot-log .err { color:#ff4444; }
#boot-log .dim { color:#006600; }
#boot-cursor {
  display:inline-block; width:8px; height:13px;
  background:#00ff41; animation:blink-cur 0.7s step-end infinite; vertical-align:bottom;
}
@keyframes blink-cur { 0%,100%{opacity:1} 50%{opacity:0} }
</style>
</head>

<script type="text/javascript">

// ── WALLPAPERS ─────────────────────────────────────────────────────────
var WALLPAPERS = [
  './desktop/wallpaper/wallpaper1.jpg',  './desktop/wallpaper/wallpaper2.jpg',
  './desktop/wallpaper/wallpaper3.jpg',  './desktop/wallpaper/wallpaper4.jpg',
  './desktop/wallpaper/wallpaper5.jpg',  './desktop/wallpaper/wallpaper6.jpg',
  './desktop/wallpaper/wallpaper7.jpg',  './desktop/wallpaper/wallpaper8.jpg',
  './desktop/wallpaper/wallpaper9.jpg',  './desktop/wallpaper/wallpaper10.jpg',
  './desktop/wallpaper/wallpaper11.png', './desktop/wallpaper/wallpaper12.jpg',
  './desktop/wallpaper/wallpaper13.png', './desktop/wallpaper/wallpaper14.jpg'
];

var PAGES = [
  { id:'index.html',      name:'moon man'   },
  { id:'about.html',      name:'About'      },
  { id:'pics.html',       name:'Pics'       },
  { id:'vids.html',       name:'Vids'       },
  { id:'dreams.html',     name:'Dreams'     },
  { id:'stream.html',     name:'Stream'     },
  { id:'music.html',      name:'Music'      },
  { id:'games.html',      name:'Games'      },
  { id:'guestbook.html',  name:'Guestbook'  },
  { id:'rant.html',       name:'Rant'       },
  { id:'faq.html',        name:'FAQ'        },
  { id:'downloads.html',  name:'Downloads'  },
  { id:'help.html',       name:'Help'       }
];

var desktop       = document.getElementById('desktop');
var currentWpIdx  = Math.floor(Math.random() * WALLPAPERS.length);
var winMap        = {}, zTop = 100, cascadeN = 0;
var tbWins        = document.getElementById('tb-wins');
var winCont       = document.getElementById('win-container');

// ── WALLPAPER ──────────────────────────────────────────────────────────
function setWallpaper(idx) {
  currentWpIdx = idx;

// ── BROWSER WINDOW ────────────────────────────────────────────────────
function openBrowser(startUrl) {
  var BID = '__browser__';
  if (winMap[BID]) {
    if (winMap[BID].minimized) restoreWin(BID); else focusWin(BID);
    if (startUrl) browserGo(startUrl);
    return;
  }

  var url     = startUrl || PAGES[0].id;
  var history = [url];
  var hidx    = 0;

  var el = document.createElement('div');
  el.className = 'win98';
  el.style.cssText = 'left:60px;top:30px;width:820px;height:' + Math.min(560,window.innerHeight-80) + 'px;z-index:'+(++zTop)+';';

  el.innerHTML =
    '<div class="win-titlebar" id="tb-'+BID+'">' +
      '<div class="win-btns">' +
        '<button class="win-btn win-btn-close" title="Close">✕</button>' +
        '<button class="win-btn win-btn-min"   title="Maximize">+</button>' +
        '<button class="win-btn win-btn-max"   title="Minimize">–</button>' +
      '</div>' +
      '<img class="win-icon" src="./desktop/icons/world.ico" style="margin-left:auto;">' +
      '<span class="win-title" id="br-title" style="flex:0;padding-right:8px;">conshaunery browser</span>' +
    '</div>' +

    '<div class="browser-toolbar">' +
      '<button class="br-btn" id="br-back"    title="Back">◀</button>' +
      '<button class="br-btn" id="br-fwd"     title="Forward">▶</button>' +
      '<button class="br-btn" id="br-refresh" title="Refresh">⟳</button>' +
      '<button class="br-btn" id="br-home"    title="Home">⌂</button>' +
      '<input  class="br-addr" id="br-addr" type="text" value="' + url + '" spellcheck="false">' +
      '<button class="br-go"  id="br-go">Go</button>' +
      '<button class="br-btn" id="br-sound"   title="Toggle page audio" style="font-size:14px;min-width:30px;">🔇</button>' +
    '</div>' +

    '<div class="browser-navbar" id="br-nav"></div>' +

    '<div class="win-body">' +
      '<iframe id="br-iframe" frameborder="0"></iframe>' +
    '</div>' +

    '<div class="br-status" id="br-status">ready</div>' +

    '<div class="win-resize"></div>';

  winCont.appendChild(el);

  // Refs
  var iframe    = el.querySelector('#br-iframe');
  var addrBar   = el.querySelector('#br-addr');
  var status    = el.querySelector('#br-status');
  var backBtn   = el.querySelector('#br-back');
  var fwdBtn    = el.querySelector('#br-fwd');
  var title     = el.querySelector('#br-title');
  var navBar    = el.querySelector('#br-nav');
  var soundBtn  = el.querySelector('#br-sound');

  // ── Browser audio via postMessage ──────────────────────────────────────
  var iframeSoundOn = false;

  function sendAudioMsg(msg) {
    try { iframe.contentWindow.postMessage(msg, '*'); } catch(e) {}
  }

  soundBtn.addEventListener('click', function() {
    iframeSoundOn = !iframeSoundOn;
    soundBtn.textContent = iframeSoundOn ? '🔊' : '🔇';
    sendAudioMsg(iframeSoundOn ? 'desk:unmute' : 'desk:mute');
  });

  // Nav bar buttons
  PAGES.forEach(function(p) {
    var btn = document.createElement('button');
    btn.className = 'br-link' + (p.id===url?' current':'');
    btn.textContent = p.name;
    btn.dataset.id  = p.id;
    btn.addEventListener('click', function(){ browserGo(p.id); });
    navBar.appendChild(btn);
  });


  function syncNav(currentUrl) {
    navBar.querySelectorAll('.br-link').forEach(function(b){
      b.classList.toggle('current', b.dataset.id === currentUrl);
    });
  }

  function updateNav() {
    backBtn.disabled = (hidx <= 0);
    fwdBtn.disabled  = (hidx >= history.length - 1);
  }

  function browserGo(href) {
    history = history.slice(0, hidx+1);
    history.push(href); hidx = history.length-1;
    navigate(href); updateNav();
  }

  function navigate(href) {
    status.textContent = 'loading ' + href + '...';
    var src = href.indexOf('?') >= 0 ? href + '&nomedia=1' : href + '?nomedia=1';
    iframe.src = src;
    addrBar.value = href;
    syncNav(href);
  }

  // Re-expose so openBrowser can call it if already open
  winMap[BID] = winMap[BID] || {};
  winMap[BID].browserGo = browserGo;

  iframe.addEventListener('load', function() {
    var doc;
    try { doc = iframe.contentDocument || iframe.contentWindow.document; } catch(e) {}
    var t = doc && doc.title ? doc.title : addrBar.value;
    title.textContent = t + ' — conshaunery browser';
    status.textContent = 'done';
    // Enforce current mute state on newly loaded page
    sendAudioMsg(iframeSoundOn ? 'desk:unmute' : 'desk:mute');
  });

  // Toolbar buttons
  backBtn.addEventListener('click', function() {
    if (hidx>0){ hidx--; navigate(history[hidx]); updateNav(); }
  });
  fwdBtn.addEventListener('click', function() {
    if (hidx<history.length-1){ hidx++; navigate(history[hidx]); updateNav(); }
  });
  el.querySelector('#br-refresh').addEventListener('click', function() { navigate(history[hidx]); });
  el.querySelector('#br-home').addEventListener('click',    function() { browserGo(PAGES[0].id); });
  el.querySelector('#br-go').addEventListener('click',      function() { browserGo(addrBar.value.trim()); });
  addrBar.addEventListener('keydown', function(e){ if(e.key==='Enter') browserGo(addrBar.value.trim()); });

  updateNav();

  // NOW start loading — mute loop is already running so it catches audio immediately
  navigate(url);

  var state = {
    el:el, page:{id:BID, name:'browser', icon:'./desktop/icons/world.ico'},
    minimized:false, maximized:false, savedLeft:'',savedTop:'',savedW:'',savedH:'',
    browserGo: browserGo,
    onClose: function() {}
  };
  winMap[BID] = state;

  el.querySelector('.win-btn-close').addEventListener('click', function(e){ closeWin(BID);     e.stopPropagation(); });
  el.querySelector('.win-btn-min'  ).addEventListener('click', function(e){ toggleMaxWin(BID); e.stopPropagation(); });
  el.querySelector('.win-btn-max'  ).addEventListener('click', function(e){ minimizeWin(BID);  e.stopPropagation(); });

  makeDraggable(el, document.getElementById('tb-'+BID));
  makeResizable(el, el.querySelector('.win-resize'));
  el.addEventListener('mousedown', function(){ focusWin(BID); });

  addTbBtn(state.page, state);
  focusWin(BID);
}

// Re-navigate if browser already open
function browserGo(url) {
  var st = winMap['__browser__'];
  if (st && st.browserGo) st.browserGo(url);
}

        '<span class="np-saved" id="np-saved"></span>' +
      '</div>' +

  var savedLbl = el.querySelector('#np-saved');
  var charsLbl = el.querySelector('#np-chars');
  var linesLbl = el.querySelector('#np-lines');

  var STORE_KEY = 'conshaunery_journal';
  var saveTimer = null;

  // Load saved content
  try { area.value = localStorage.getItem(STORE_KEY) || ''; } catch(e) {}

  function updateStatus() {
    var v = area.value;
    charsLbl.textContent = v.length + ' char' + (v.length!==1?'s':'');
    linesLbl.textContent = v.split('\n').length + ' line' + (v.split('\n').length!==1?'s':'');
  }
  updateStatus();

  function save() {
    try { localStorage.setItem(STORE_KEY, area.value); } catch(e) {}
    savedLbl.textContent = 'saved ✓';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ savedLbl.textContent=''; }, 2000);
  }

  // Auto-save 2s after last keystroke
  var autoTimer = null;
  area.addEventListener('input', function() {
    updateStatus();
    clearTimeout(autoTimer);
    savedLbl.textContent = '...';
    autoTimer = setTimeout(save, 2000);
  });

  saveBtn.addEventListener('click', function() { save(); area.focus(); });
  clearBtn.addEventListener('click', function() {
    if (area.value && !confirm('Clear the journal?')) return;
    area.value = '';
    save(); updateStatus();
    area.focus();
  });

  // Ctrl+S to save
  area.addEventListener('keydown', function(e) {
    if ((e.ctrlKey||e.metaKey) && e.key==='s') { e.preventDefault(); save(); }
  });

  var state = {
    el:el, page:{id:NID, name:'journal', icon:'./desktop/icons/sticky_note.ico'},
    minimized:false, maximized:false, savedLeft:'',savedTop:'',savedW:'',savedH:''
  };

  el.querySelector('.win-btn-close').addEventListener('click', function(e){ save(); closeWin(NID);     e.stopPropagation(); });
  el.querySelector('.win-btn-min'  ).addEventListener('click', function(e){         minimizeWin(NID);  e.stopPropagation(); });
  el.querySelector('.win-btn-max'  ).addEventListener('click', function(e){         toggleMaxWin(NID); e.stopPropagation(); });

  makeDraggable(el, document.getElementById('tb-'+NID));
  makeResizable(el, el.querySelector('.win-resize'));
  el.addEventListener('mousedown', function(){ focusWin(NID); });
  addTbBtn(state.page, state);
  focusWin(NID);
  setTimeout(function(){ area.focus(); }, 50);
}

function openFileExplorer(startPath) {
  var FID = '__files__';
  if (winMap[FID]) { if(winMap[FID].minimized) restoreWin(FID); else focusWin(FID); return; }

  var curDir = startPath || '';

  var el = document.createElement('div');
  el.className = 'win98';
  el.style.cssText = 'left:120px;top:50px;width:680px;height:460px;z-index:'+(++zTop)+';';

  el.innerHTML =
    '<div class="win-titlebar" id="tb-'+FID+'">' +
      '<div class="win-btns">' +
        '<button class="win-btn win-btn-close" title="Close">✕</button>' +
        '<button class="win-btn win-btn-min"   title="Minimize">–</button>' +
        '<button class="win-btn win-btn-max"   title="Maximize">+</button>' +
      '</div>' +
      '<img class="win-icon" src="./desktop/icons/folder_dark.ico">' +
      '<span class="win-title" id="fe-title">conshaunery.com</span>' +
    '</div>' +
    '<div class="fexp-toolbar">' +
      '<button class="fexp-up" id="fe-up">↑ Up</button>' +
      '<input class="fexp-addr" id="fe-addr" type="text" readonly>' +
    '</div>' +
    '<div class="fexp-wrap">' +
      '<div class="fexp-tree" id="fe-tree"></div>' +
      '<div class="fexp-content" id="fe-content"></div>' +
    '</div>' +
    '<div class="fexp-status" id="fe-status"></div>' +
    '<div class="win-resize"></div>';

  winCont.appendChild(el);

  var treeEl   = el.querySelector('#fe-tree');
  var contentEl= el.querySelector('#fe-content');
  var addrEl   = el.querySelector('#fe-addr');
  var statusEl = el.querySelector('#fe-status');
  var upBtn    = el.querySelector('#fe-up');
  var titleEl  = el.querySelector('#fe-title');

  // Build static folder tree
  FE_ALL_DIRS.forEach(function(d) {
    var node = document.createElement('div');
    node.className = 'fexp-tnode';
    node.style.paddingLeft = (5 + (FE_DIR_INDENT[d]||0)*12) + 'px';
    node.innerHTML = '<img src="./desktop/icons/folder_dark.ico">' + (FE_DIR_LABEL[d]||d);
    node.dataset.path = d;
    node.addEventListener('click', function() { navTo(d); });
    treeEl.appendChild(node);
  });

  function navTo(path) {
    curDir = path;
    addrEl.value = path === '' ? '/' : '/' + path + '/';
    titleEl.textContent = FE_DIR_LABEL[path] || path || 'conshaunery.com';
    upBtn.disabled = (path === '');
    treeEl.querySelectorAll('.fexp-tnode').forEach(function(n){
      n.classList.toggle('fsel', n.dataset.path === path);
    });
    contentEl.innerHTML = '';
    var entry = FS_TREE[path];
    if (!entry) return;
    var total = 0;
    entry.dirs.forEach(function(sub) {
      contentEl.appendChild(makeItem(sub.split('/').pop(), 'dir', sub, true));
      total++;
    });
    entry.files.forEach(function(file) {
      contentEl.appendChild(makeItem(file.n, file.t, (path ? path+'/' : '') + file.n, false));
      total++;
    });
    statusEl.textContent = total + ' item' + (total!==1?'s':'');
  }

  function makeItem(name, type, fullPath, isDir) {
    var item = document.createElement('div');
    item.className = 'fexp-file';
    item.innerHTML = '<img src="' + feIcon(isDir?'dir':type) + '"><span>' + name + '</span>';
    var lastClick = 0;
    item.addEventListener('click', function(e) {
      contentEl.querySelectorAll('.fexp-file').forEach(function(f){ f.classList.remove('fsel'); });
      item.classList.add('fsel');
      statusEl.textContent = name;
      var now = Date.now();
      if (now - lastClick < 500) {
        if (isDir) { navTo(fullPath); }
        else if (type === 'html') { openBrowser(fullPath); }
      }
      lastClick = now;
      e.stopPropagation();
    });
    return item;
  }

  upBtn.addEventListener('click', function() {
    if (!curDir) return;
    var parts = curDir.split('/'); parts.pop();
    navTo(parts.join('/'));
  });
  contentEl.addEventListener('click', function() {
    contentEl.querySelectorAll('.fexp-file').forEach(function(f){ f.classList.remove('fsel'); });
    statusEl.textContent = contentEl.querySelectorAll('.fexp-file').length + ' items';
  });

  navTo(curDir);

  var state = {
    el:el, page:{id:FID, name:'files', icon:'./desktop/icons/folder_dark.ico'},
    minimized:false, maximized:false, savedLeft:'',savedTop:'',savedW:'',savedH:''
  };
  winMap[FID] = state;

  el.querySelector('.win-btn-close').addEventListener('click', function(e){ closeWin(FID);     e.stopPropagation(); });
  el.querySelector('.win-btn-min'  ).addEventListener('click', function(e){ minimizeWin(FID);  e.stopPropagation(); });
  el.querySelector('.win-btn-max'  ).addEventListener('click', function(e){ toggleMaxWin(FID); e.stopPropagation(); });

  makeDraggable(el, document.getElementById('tb-'+FID));
  makeResizable(el, el.querySelector('.win-resize'));
  el.addEventListener('mousedown', function(){ focusWin(FID); });
  addTbBtn(state.page, state);
  focusWin(FID);
}

// ── WINDOW HELPERS ─────────────────────────────────────────────────────
function focusWin(id) {
  var st=winMap[id]; if(!st) return;
  st.el.style.zIndex=++zTop;
  document.querySelectorAll('.win-titlebar').forEach(function(tb){ tb.classList.add('inactive'); });
  var tb=document.getElementById('tb-'+id); if(tb) tb.classList.remove('inactive');
}
function minimizeWin(id) {
  var st=winMap[id]; if(!st) return;
  st.minimized=true; st.el.classList.add('minimized');
  if(st.tbBtn){ st.tbBtn.classList.add('minimized-btn'); }
}
function restoreWin(id) {
  var st=winMap[id]; if(!st) return;
  st.minimized=false; st.el.classList.remove('minimized');
  if(st.tbBtn){ st.tbBtn.classList.remove('minimized-btn'); }
  focusWin(id);
}
function toggleMaxWin(id) {
  var st=winMap[id]; if(!st) return; var el=st.el;
  if(!st.maximized){
    st.savedLeft=el.style.left; st.savedTop=el.style.top; st.savedW=el.style.width; st.savedH=el.style.height;
    el.style.left='0'; el.style.top='0';
    el.style.width=window.innerWidth+'px'; el.style.height=(window.innerHeight-32)+'px';
    st.maximized=true;
  } else {
    el.style.left=st.savedLeft; el.style.top=st.savedTop; el.style.width=st.savedW; el.style.height=st.savedH;
    st.maximized=false;
  }
  focusWin(id);
}
function closeWin(id) {
  var st=winMap[id]; if(!st) return;
  if (st.onClose) st.onClose();
  st.el.remove(); if(st.tbBtn) st.tbBtn.remove(); delete winMap[id];
}
function addTbBtn(page, state) {
  var btn=document.createElement('button');
  btn.className='tb-win-btn';
  btn.innerHTML='<img src="'+page.icon+'">'+page.name;
  btn.addEventListener('click',function(){ if(state.minimized) restoreWin(page.id); else minimizeWin(page.id); });
  tbWins.appendChild(btn);
  state.tbBtn=btn;
}
function makeDraggable(el, handle) {
  var ox,oy,ol,ot;
  handle.addEventListener('mousedown',function(e){
    if(e.target.classList.contains('win-btn')) return;
    for(var id in winMap){ if(winMap[id].el===el&&winMap[id].maximized) return; }
    ox=e.clientX; oy=e.clientY; ol=parseInt(el.style.left)||0; ot=parseInt(el.style.top)||0;
    function onMove(e){ el.style.left=(ol+e.clientX-ox)+'px'; el.style.top=(ot+e.clientY-oy)+'px'; }
    function onUp(){ document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp); }
    document.addEventListener('mousemove',onMove); document.addEventListener('mouseup',onUp); e.preventDefault();
  });
}
function makeResizable(el, handle) {
  var ox,oy,ow,oh;
  handle.addEventListener('mousedown',function(e){
    ox=e.clientX; oy=e.clientY; ow=el.offsetWidth; oh=el.offsetHeight;
    function onMove(e){ el.style.width=Math.max(400,ow+(e.clientX-ox))+'px'; el.style.height=Math.max(260,oh+(e.clientY-oy))+'px'; }
    function onUp(){ document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp); }
    document.addEventListener('mousemove',onMove); document.addEventListener('mouseup',onUp); e.preventDefault(); e.stopPropagation();
  });
}

    '<div style="font-size:13px;letter-spacing:3px;color:rgba(150,100,220,0.7);">Shutting down...</div>' +
    '<div style="margin-top:18px;font-size:10px;letter-spacing:2px;color:rgba(80,50,120,0.5);">conshaunery.com</div>';
  document.body.appendChild(overlay);

  var logoffSfx = document.getElementById('logoff-sfx');
  var done = false;
  function reload() {
    if (done) return; done = true;
    // Reset the nav frame so the power button reappears, then reload this frame
    try { window.parent.frames['nav'].location.href = 'melonking_scroll.html'; } catch(e) {}
    window.location.reload();
  }
  logoffSfx.addEventListener('ended', reload, {once: true});
  setTimeout(reload, 9000); // safeguard
  logoffSfx.play().catch(function() { setTimeout(reload, 800); });
}
</script>

<script>
// ── BOOT SEQUENCE ──────────────────────────────────────────────────────
var BOOT_LINES = [
  { t:'[    0.000] CONSHAUNERY OS — initializing system...',          d:0   },
  { t:'[    0.041] Detected CPU: ∞ vibes/sec',                        d:280 },
  { t:'[    0.189] Checking memory: 640K ought to be enough for anyone',d:220},
  { t:'[    0.334] Loading kernel modules...',                         d:260 },
  { t:'[    0.521] Starting audio daemon',              ok:true,       d:300 },
  { t:'[    0.788] Mounting /dev/dreamz',               ok:true,       d:240 },
  { t:'[    1.023] Loading graphics subsystem',         ok:true,       d:220 },
  { t:'[    1.256] Initializing network stack',         ok:true,       d:280 },
  { t:'[    1.489] Starting vibeCode.service',          ok:true,       d:300 },
  { t:'[    1.712] Mounting user filesystem',           ok:true,       d:220 },
  { t:'[    1.934] Loading window manager',             ok:true,       d:260 },
  { t:'[    2.167] Applying desktop wallpaper',         ok:true,       d:240 },
  { t:'[    2.401] Starting conshaunery.service',       ok:true,       d:300 },
  { t:'[    2.634] Running startup scripts',            ok:true,       d:220 },
  { t:'[    2.867] All services started successfully.',                d:300 },
  { t:'',                                                              d:180 },
  { t:'    Welcome to conshaunery.com',                               d:350 },
];

var bootOverlay = document.getElementById('boot-overlay');
var bootLog     = document.getElementById('boot-log');
var bootSfx     = document.getElementById('boot-sfx');
var bootDone    = false;

function startBoot() {
  if (bootDone) return;
  bootDone = true;

  // Play boot SFX
  try { bootSfx.play().catch(function(){}); } catch(e) {}

  var cursor = document.getElementById('boot-cursor');
  var delay  = 0;

  BOOT_LINES.forEach(function(line, i) {
    delay += line.d;
    setTimeout(function() {
      var row = document.createElement('div');
      if (line.ok) {
        var parts = line.t.split(/\.\.\.$|(?=\s*$)/);
        row.innerHTML = '<span class="dim">' + line.t + '</span> <span class="ok">[  OK  ]</span>';
      } else if (line.t === '') {
        row.innerHTML = '&nbsp;';
      } else {
        row.textContent = line.t;
      }
      bootLog.insertBefore(row, cursor);
      bootLog.scrollTop = bootLog.scrollHeight;
    }, delay);
  });

  // After last line, pause then fade out, then play login sound → background music
  var totalDelay = delay + 900;
  setTimeout(function() {
    bootOverlay.classList.add('fade-out');
    setTimeout(function() {
      bootOverlay.style.display = 'none';
      var loginSfx = document.getElementById('login-sfx');
      var musicStarted = false;
      function startMusic() {
        if (musicStarted) return; musicStarted = true; tryPlay();
      }
      loginSfx.addEventListener('ended', startMusic, {once: true});
      setTimeout(startMusic, 8000); // safeguard if sound never fires
      loginSfx.play().catch(function() { startMusic(); });
    }, 850);
  }, totalDelay);
}

// If loaded in the frameset main frame, wait for signal from melonscroll.
// If accessed directly, boot immediately.
if (window.name === 'main') {
  window.addEventListener('message', function(e) {
    if (e.data === 'startBoot') startBoot();
  });
} else {
  setTimeout(startBoot, 400);
}
</script>
