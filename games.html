<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
<title>games — conshaunery.com</title>
<style type="text/css">

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #000008;
    color: #ffffff;
    font-family: "Comic Sans MS", "Trebuchet MS", Arial, sans-serif;
    font-size: 15px;
    min-height: 100%;
  }

  .rainbow-bar {
    height: 5px;
    background: linear-gradient(90deg,#ff0000,#ff8800,#ffff00,#00ff88,#00ccff,#cc00ff,#ff0088,#ff0000);
    background-size: 200% 100%;
    animation: rb 3s linear infinite;
    position: sticky; top: 0; z-index: 100;
  }
  @keyframes rb { 0%{background-position:0% 0} 100%{background-position:200% 0} }

  .wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 0 20px 70px;
    position: relative; z-index: 1;
  }

  header {
    text-align: center;
    padding: 26px 0 10px;
    border-bottom: 2px solid #6600cc;
    margin-bottom: 28px;
  }
  header img { max-width: 100%; max-height: 130px; display: inline-block; }
  .header-sub {
    font-size: 10px; letter-spacing: 3px; color: #8888cc; margin-top: 5px;
    animation: blink 2.8s step-end infinite;
  }
  @keyframes blink { 0%,85%,100%{opacity:1} 86%,99%{opacity:0} }

  /* ── PANEL ── */
  .panel {
    border: 1px solid #330055;
    background: rgba(10,0,20,0.6);
    box-shadow: 0 0 18px rgba(100,0,180,0.1), inset 0 0 30px rgba(0,0,10,0.4);
    margin-bottom: 16px;
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 14px;
    background: linear-gradient(90deg, #1a0033, #0d001a);
    border-bottom: 1px solid #440066;
  }
  .panel-title {
    font-family: "Impact", "Arial Black", sans-serif;
    font-size: 13px; letter-spacing: 4px; text-transform: uppercase;
    color: #ffff00; text-shadow: 0 0 8px rgba(255,220,0,0.6), 1px 1px 0 #440000;
  }
  .panel-stars { color: #cc66ff; font-size: 11px; letter-spacing: 2px; }

  .panel-body {
    padding: 24px 28px;
    text-align: center;
  }
  .panel-body p {
    font-size: 14px; line-height: 1.8; color: #ccbbdd; margin-bottom: 12px;
  }

  /* ── SECRET LINK ── */
  .secret-link {
    display: inline-block;
    background: linear-gradient(180deg, #6600cc, #330066);
    border: 2px outset #cc66ff;
    color: #ffff00;
    font-family: "Comic Sans MS", Arial, sans-serif;
    font-size: 13px; font-weight: bold;
    padding: 7px 20px; cursor: pointer;
    text-decoration: none; letter-spacing: 1px;
    transition: background 0.2s;
    margin: 8px 0 16px;
    display: inline-block;
  }
  .secret-link:hover {
    background: linear-gradient(180deg, #9933ff, #440099);
    color: #ffffff;
  }

  /* ── HANDI IMAGE ── */
  .handi-wrap {
    margin: 10px auto 0;
    border: 2px solid #330055;
    display: inline-block;
    box-shadow: 0 0 20px rgba(100,0,180,0.25);
  }
  .handi-wrap img { display: block; max-width: 100%; }

  /* ── COMING SOON GRID (placeholder slots) ── */
  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
    margin-top: 6px;
  }
  .game-slot {
    border: 1px dashed #330055;
    background: rgba(5,0,12,0.5);
    height: 120px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #332244; font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase;
    transition: border-color 0.2s, color 0.2s;
  }
  .game-slot:hover { border-color: #550088; color: #664466; }
  .game-slot span { font-size: 22px; margin-bottom: 6px; opacity: 0.3; }

  footer { text-align: center; border-top: 2px solid #330055; padding: 18px 0 10px; margin-top: 10px; }
  footer p { font-size: 10px; color: #554477; letter-spacing: 2px; }

</style>
</head>
<body>

<div class="rainbow-bar"></div>

<audio autoplay loop>
  <source src="./sounds/music/games_vox.mp3" type="audio/mpeg">
</audio>

<div class="wrap">

  <header>
    <img src="./gifs/Gamez!.gif" alt="GAMES">
    <div class="header-sub">~ the arcade dimension ~</div>
  </header>

  <!-- LOST THE GAME -->
  <div class="panel">
    <div class="panel-head">
      <span class="panel-title">You'vest Lost the Gaems lol</span>
      <span class="panel-stars">&#9733; &#9733; &#9733;</span>
    </div>
    <div class="panel-body">
      <a class="secret-link" href="r_game_home.html">&#9654; but hangings of on! clicking for secret real games!</a>
      <br>
      <div class="handi-wrap">
        <img src="./pictures/handi.gif" alt="handi" style="max-width:800px;">
      </div>
    </div>
  </div>

  <!-- COMING SOON -->
  <div class="panel">
    <div class="panel-head">
      <span class="panel-title">Games Vault</span>
      <span class="panel-stars">&#9733; &#9733; &#9733;</span>
    </div>
    <div class="panel-body">
      <p>games coming soon... probably... maybe...</p>
      <div class="games-grid">
        <div class="game-slot"><span>&#63;</span>coming soon</div>
        <div class="game-slot"><span>&#63;</span>coming soon</div>
        <div class="game-slot"><span>&#63;</span>coming soon</div>
        <div class="game-slot"><span>&#63;</span>coming soon</div>
        <div class="game-slot"><span>&#63;</span>coming soon</div>
        <div class="game-slot"><span>&#63;</span>coming soon</div>
      </div>
    </div>
  </div>

  <footer>
    <p>conshaunery was here.</p>
  </footer>

</div>

<script type="text/javascript">
  (function() {
    var cv = document.createElement('canvas');
    cv.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:0;';
    document.body.insertBefore(cv, document.body.firstChild);
    var ctx = cv.getContext('2d'), stars = [];
    function resize() {
      cv.width=window.innerWidth; cv.height=window.innerHeight; stars=[];
      for(var i=0;i<200;i++) stars.push({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.3+0.2,ph:Math.random()*Math.PI*2,sp:Math.random()*0.008+0.003});
    }
    function draw() {
      ctx.clearRect(0,0,cv.width,cv.height);
      var t=Date.now()/1000;
      for(var i=0;i<stars.length;i++){var s=stars[i],a=0.2+0.65*((Math.sin(t*s.sp*120+s.ph)+1)/2);ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle='rgba(200,180,255,'+a.toFixed(2)+')';ctx.fill();}
      requestAnimationFrame(draw);
    }
    window.addEventListener('resize',resize); resize(); draw();
  })();
</script>

<script src="./transition.js"></script>
</body>
</html>
